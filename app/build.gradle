plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.maxcombo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.maxcombo'
        minSdk 26
        targetSdk 34
        versionCode 36
        versionName '4.6'
    }

    // Fixed keystore committed in the repo so every CI build shares the SAME
    // signature: the APK can be installed over the previous one without
    // uninstalling. (A freshly generated CI debug keystore differs each run.)
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
